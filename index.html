<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nubes - Volumetric Raymarching</title>
    <!-- Trunk will automatically compile and inject the Rust WebAssembly here -->
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="rust-desert-sunset" data-wasm-opt="z" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        #wasm-example {
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 10; 
            background: rgba(0,0,0,0.5); 
            padding: 15px; 
            border-radius: 8px; 
            font-family: monospace; 
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body id="wasm-example">
    <div id="ui">
        <label for="windSlider" style="display: block; margin-bottom: 10px;">Viento: <span id="windValue">1.0</span>x</label>
        <input type="range" id="windSlider" min="0.0" max="5.0" step="0.1" value="1.0" style="width: 200px;">
    </div>
    <!-- 
        Trunk executes our main.rs, which will attach the event listeners 
        using web-sys directly from Rust to keep the architecture clean.
    -->
</body>
</html>
