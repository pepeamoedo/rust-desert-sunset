<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nubes - Volumetric Raymarching</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        #wasm-example {
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body id="wasm-example">
    <script type="module">
        import init from './pkg/rust_desert_sunset.js';
        
        async function run() {
            try {
                await init();
            } catch (error) {
                console.error("Error initializing WebAssembly module:", error);
                document.body.innerHTML = `<div style="padding: 20px;">
                    <h2>Error loading WebAssembly</h2>
                    <p>${error.message}</p>
                    <p>Make sure your browser supports WebGPU and you are serving via HTTP.</p>
                </div>`;
            }
        }
        
        run();
    </script>
</body>
</html>
